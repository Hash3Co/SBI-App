# docker-compose.yml
version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=sbi_backend.settings
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    env_file:
      - .env
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      - redis
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --worker-class=gthread --worker-tmp-dir=/dev/shm --timeout 120 sbi_backend.wsgi:application
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DJANGO_SETTINGS_MODULE=sbi_backend.settings
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    env_file:
      - .env
    depends_on:
      - redis
      - web
    command: celery -A sbi_backend worker --loglevel=info --concurrency=4 --max-tasks-per-child=1000
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DJANGO_SETTINGS_MODULE=sbi_backend.settings
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    env_file:
      - .env
    depends_on:
      - redis
      - web
    command: celery -A sbi_backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  redis_data:
  staticfiles:
  media:
  logs: